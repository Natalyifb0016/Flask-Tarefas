
<html>
 <head>
    <title>Minha Lista de Tarefas</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
 </head>
  <body>
     Minhas Tarefas

     {% if lista %}
      <ol>
       {% for item in lista %}
       <li>{{ item }}</li>
       <a href="/delete/{{loop.index0}}"><button>lixo</button></a>
       {% endfor %}
       </ol>
     {% else %}
        <p>Não há items! Parabéns! Você fez tudo das tarefas</p>
     {% endif %}

    <form action="/add" method="post">
        <input type="text" name="nova">
        <button type="submit">Adicionar</button>
    </form>
            
  </body>
</html>
